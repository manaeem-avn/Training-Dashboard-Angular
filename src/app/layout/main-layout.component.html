<div class="shell" [class.collapsed]="collapsed()" [class.mobile-open]="mobileOpen()">
  <aside class="sidebar">
    <div class="brand">
      <i class="pi pi-th-large"></i>
      <span class="brand-text">Work Portal</span>
    </div>

    <nav>
      <a
        *ngFor="let item of visibleItems"
        [routerLink]="item.route"
        routerLinkActive="active"
        class="nav-item"
        (click)="closeMobile()">
        <i [class]="item.icon"></i>
        <span class="nav-text">{{ item.label }}</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <span class="nav-text">v1.0 &middot; .NET 8 + Angular 18</span>
    </div>
  </aside>

  <div class="backdrop" (click)="closeMobile()"></div>

  <div class="main">
    <header class="topbar">
      <button
        type="button"
        class="icon-button"
        aria-label="Toggle menu"
        (click)="toggle()">
        <i class="pi pi-bars"></i>
      </button>

      <span class="topbar-title">Enterprise Work Management Portal</span>

      <div class="topbar-right">
        <span class="avatar">{{ initials() }}</span>
        <div class="who">
          <strong>{{ auth.user()?.fullName }}</strong>
          <small>{{ auth.user()?.role }}</small>
        </div>
        <p-button
          icon="pi pi-sign-out"
          severity="secondary"
          [text]="true"
          label="Sign out"
          (onClick)="auth.logout()" />
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
