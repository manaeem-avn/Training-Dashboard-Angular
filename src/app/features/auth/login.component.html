<div class="login-page">
  <div class="login-card">
    <h1>Work Portal</h1>
    <p class="tagline">Enterprise Work Management</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" autocomplete="username" />
        <small class="error" *ngIf="invalid('email')">
          {{ form.controls.email.hasError('required') ? 'Email is required.' : 'Enter a valid email address.' }}
        </small>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" autocomplete="current-password" />
        <small class="error" *ngIf="invalid('password')">
          {{ form.controls.password.hasError('required') ? 'Password is required.' : 'Password must be at least 6 characters.' }}
        </small>
      </div>

      <p class="form-error" *ngIf="error()">{{ error() }}</p>

      <button type="submit" class="btn full" [disabled]="loading()">
        {{ loading() ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>

    <div class="demo">
      <span>Demo accounts</span>
      <button type="button" (click)="useDemo('admin@workportal.com', 'Admin123!')">Admin</button>
      <button type="button" (click)="useDemo('alex@workportal.com', 'User1234!')">User</button>
    </div>
  </div>
</div>
